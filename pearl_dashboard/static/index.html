<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pearl 租卡挖矿</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --border: #e3e2de;
  --ink: #1f1f1d; --ink-2: #55534e; --ink-3: #8a8780;
  --good: #0ca30c; --good-ink: #006300; --bad: #d03b3b; --bad-ink: #a32222; --warn: #fab219;
  --accent: #2f6fdb; --accent-ink: #ffffff;
  --series-1: #2a78d6; --series-2: #eb6834; --band: rgba(12, 163, 12, .08); --grid: #ecebe7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1a1a19; --border: #2e2d2a;
    --ink: #eeede9; --ink-2: #b4b1aa; --ink-3: #85827b;
    --good-ink: #5fd35f; --bad-ink: #ff8a80; --accent: #6b9cf0; --accent-ink: #0d0d0c;
    --series-1: #3987e5; --series-2: #d95926; --band: rgba(12, 163, 12, .08); --grid: #2a2927;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 24px 0 8px; }
.muted { color: var(--ink-3); }
.sub { color: var(--ink-2); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--ink-3); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad-ink); border-color: var(--bad); }
button:disabled { opacity: .5; cursor: not-allowed; }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
button.busy { opacity: .7; cursor: progress; }
.status { margin-top: 4px; font-size: 13px; color: var(--ink-2); }
.status b { color: var(--ink); font-weight: 600; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100vw - 32px);
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 10; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
#toast.err { background: var(--bad); color: #fff; }
.notice { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); font-size: 13px; }
.notice.warn { border-left: 4px solid var(--warn); }
.notice.err { border-left: 4px solid var(--bad); }
.tile a, .notice a { color: var(--accent); cursor: pointer; text-decoration: underline; }
dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--ink);
  padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog form { padding: 18px 20px; }
dialog h3 { margin: 0 0 4px; font-size: 16px; }
dialog fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 14px 0 0; padding: 10px 12px 12px; }
dialog legend { padding: 0 6px; color: var(--ink-2); font-size: 13px; }
.field { display: grid; gap: 4px; margin-top: 10px; }
.field > span { font-size: 13px; color: var(--ink-2); }
.field input[type=text], .field input[type=password], .field input[type=number] { width: 100%; }
.field input { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--ink); }
.check { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
#set-error { color: var(--bad-ink); font-size: 13px; margin-top: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
th { color: var(--ink-2); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
tr:last-child td { border-bottom: 0; }
tr.loss td { color: var(--ink-3); }
.pnl { display: inline-flex; gap: 4px; align-items: center; }
.pnl.up { color: var(--good-ink); } .pnl.down { color: var(--bad-ink); }
.bar { display: inline-block; width: 4px; height: 14px; border-radius: 2px; vertical-align: -2px; margin-right: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; }
.controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 13px; }
input[type=number], select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); width: 100px; }
.log { max-height: 320px; overflow-y: auto; font-size: 13px; }
.log div { padding: 6px 12px; border-bottom: 1px solid var(--border); }
.empty { padding: 16px; color: var(--ink-3); text-align: center; }
.chart-card { padding: 12px 14px; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.sw.dash { border-top-style: dashed; }
.sw.band { height: 10px; border: 0; background: var(--band); }
.chart-wrap { position: relative; }
#chart { display: block; width: 100%; height: 220px; touch-action: pan-y; }
#chart text { fill: var(--ink-3); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); white-space: nowrap; }
.tip b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Pearl (PRL) 租卡挖矿</h1>
      <div class="sub" id="updated">加载中…</div>
      <div class="status" id="activity" aria-live="polite"></div>
    </div>
    <div class="btns">
      <span class="badge" id="mode"></span>
      <button id="btn-sim">模拟</button>
      <button id="btn-live" class="primary">确认开始真租</button>
      <button id="btn-pause">暂停租新卡</button>
      <button id="btn-stop" class="danger">紧急停止并全部退租</button>
      <button id="btn-settings">设置</button>
    </div>
  </header>
  <div id="notices"></div>

  <section class="tiles" id="tiles"></section>

  <h2>过去 24 小时</h2>
  <div class="sub" id="hist-verdict"></div>
  <section class="tiles" id="hist-tiles"></section>
  <div class="card chart-card" style="margin-top:12px">
    <div class="legend">
      <span><i class="sw" style="border-color:var(--series-1)"></i>PRL 价格</span>
      <span><i class="sw dash" style="border-color:var(--series-2)"></i>最便宜合格卡的保本价</span>
      <span><i class="sw band"></i><span id="band-label">有值得租的卡</span></span>
    </div>
    <div class="chart-wrap"><svg id="chart" role="img" aria-label="过去 24 小时 PRL 价格与保本价"></svg>
      <div class="tip" id="tip" hidden></div></div>
  </div>

  <h2>运行中的实例</h2>
  <div class="card"><table id="inst"></table></div>

  <h2>市场报价（按预期利润率排序）</h2>
  <div class="controls">
    <label>假设币价 $ <input type="number" id="wi-price" step="0.01" min="0"></label>
    <label>难度 × <input type="number" id="wi-diff" step="0.1" min="0.1" value="1"></label>
    <button id="wi-reset">用实时值</button>
    <label>平台 <select id="f-plat"><option value="">全部</option></select></label>
    <label><input type="checkbox" id="f-profit"> 只看赚钱的</label>
  </div>
  <div class="card"><table id="offers"></table></div>

  <h2>操作日志</h2>
  <div class="card log" id="log"></div>
  <p class="sub">数字是估算，矿池实际到账才是准的。币价、难度随时在变。</p>
</main>
<div id="toast" role="status"></div>
<dialog id="settings">
  <form method="dialog" id="set-form">
    <h3>设置</h3>
    <div class="sub" id="set-path"></div>
    <fieldset>
      <legend>PRL 价格</legend>
      <label class="field"><span>SafeTrade 交易对（默认 prlusdt）</span>
        <input type="text" id="set-market" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span>CoinGecko 币 id（备用价格源，可空；别填成同名的 Perle）</span>
        <input type="text" id="set-coingecko" autocomplete="off" spellcheck="false" placeholder="例如 pearl"></label>
      <label class="field"><span>手动价格（美元，可空）</span>
        <input type="number" id="set-manual" step="0.0001" min="0" placeholder="例如 2.00"></label>
      <label class="check"><input type="checkbox" id="set-manual-sim">
        <span>拿不到实时价格时，模拟模式用手动价格继续算（真租永远不用手动价格）</span></label>
    </fieldset>
    <fieldset>
      <legend>Vast.ai 账户</legend>
      <label class="field"><span>API key（看余额、真租需要；只查报价可以不填）</span>
        <input type="password" id="set-key" autocomplete="off" spellcheck="false"></label>
      <label class="check" id="set-clear-row"><input type="checkbox" id="set-clear"><span>清除已保存的 key</span></label>
      <div class="sub">在 cloud.vast.ai → Account → API Keys 创建。只存在你电脑的 config.yaml 里。</div>
      <label class="field"><span>PRL 钱包地址（真租才需要）</span>
        <input type="text" id="set-wallet" autocomplete="off" spellcheck="false"></label>
    </fieldset>
    <div id="set-error"></div>
    <div class="dlg-actions">
      <button type="button" id="set-cancel">取消</button>
      <button type="submit" class="primary" id="set-save">保存</button>
    </div>
  </form>
</dialog>
<script>
const TOKEN = "__TOKEN__";
let S = null, whatIfPrice = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = (v, d = 2) => v == null ? "—" : (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(d);
const pct = v => v == null ? "—" : (v * 100).toFixed(0) + "%";
const ago = ts => { if (!ts) return "—"; const m = (Date.now() / 1000 - ts) / 60;
  return m < 1 ? "刚刚" : m < 60 ? Math.round(m) + " 分钟前" : (m / 60).toFixed(1) + " 小时前"; };
const dur = m => m < 60 ? Math.round(m) + " 分" : (m / 60).toFixed(1) + " 小时";
function pnl(v, d = 2) {
  if (v == null) return "—";
  if (Math.abs(v) < 0.5 * 10 ** -d) return usd(0, d);
  const up = v >= 0;
  return `<span class="pnl ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${usd(v, d)}</span>`;
}

function econ(usdPerHr, th) {
  const price = whatIfPrice ?? S.price.price;
  const diff = parseFloat($("wi-diff").value) || 1;
  const prlDay = th * S.yield.value * (1 - S.fee) / diff;
  const cost = usdPerHr * 24, rev = price == null ? null : prlDay * price;
  return { prlDay, cost, rev, profit: rev == null ? null : rev - cost,
    margin: rev == null || !cost ? null : (rev - cost) / cost, be: prlDay > 0 ? cost / prlDay : null };
}

let toastTimer = null;
function toast(text, isError) {
  const t = $("toast");
  t.textContent = text;
  t.className = "show" + (isError ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = isError ? "err" : ""; }, isError ? 7000 : 4500);
}

// After a click the server answers at once and runs a fresh cycle in the background;
// poll quickly until that cycle's data arrives, then report what it found.
let waitingSince = null, fastPoll = null;
function awaitFreshCycle(since) {
  // `since` is taken before the request: the server may start the new cycle before it replies.
  waitingSince = since ?? Date.now() / 1000;
  clearInterval(fastPoll);
  fastPoll = setInterval(async () => {
    await refresh();
    const done = S && S.now > waitingSince;
    if (done || Date.now() / 1000 - waitingSince > 90) {
      clearInterval(fastPoll);
      if (done) toast("已用最新数据检查了一遍：" + (S.activity || "完成"));
      waitingSince = null;
      renderStatus();
    }
  }, 2000);
  renderStatus();
}

async function post(path, body, btn) {
  const label = btn ? btn.textContent : null;
  const clickedAt = Date.now() / 1000;
  if (btn) { btn.disabled = true; btn.classList.add("busy"); btn.textContent = "处理中…"; }
  try {
    const r = await fetch(path, { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify(body || {}) });
    const data = await r.json();
    if (!r.ok) { toast(data.error || "操作失败", true); return; }
    if (data.state && data.state.price) S = data.state;
    toast(data.message || "已完成");
    awaitFreshCycle(clickedAt);
  } catch (e) {
    toast("操作失败：" + e.message, true);
  } finally {
    if (btn) { btn.classList.remove("busy"); btn.textContent = label; btn.disabled = false; }
    render();
  }
}

$("btn-sim").onclick = e => post("/api/mode", { mode: "simulate" }, e.currentTarget);
$("btn-pause").onclick = e => post("/api/mode", { mode: "halted" }, e.currentTarget);
$("btn-live").onclick = e => {
  const l = S.limits;
  if (S.mode === "live" || confirm(`确认开始真租？会花 Vast 账户里的真钱。\n\n上限：最多 ${l.max_gpus} 张卡，单卡 ≤ $${l.max_usd_per_hr_per_gpu}/h，` +
      `合计 ≤ $${l.max_hourly_spend}/h，余额低于 $${l.min_balance_reserve} 全部退租。`))
    post("/api/mode", { mode: "live" }, e.currentTarget);
};
$("btn-stop").onclick = e => { if (confirm("退掉所有 pearl- 实例并暂停？")) post("/api/stop_all", {}, e.currentTarget); };

function renderStatus() {
  if (!S || !S.price) return;
  const names = { live: "真租中", simulate: "模拟中", halted: "已暂停" };
  if (waitingSince) {  // the last activity text is from before the click: don't show it
    $("activity").innerHTML = `<b>${names[S.mode]}</b> · 正在用最新数据检查…`;
    return;
  }
  const left = Math.max(0, Math.round((S.next_cycle_at || 0) - Date.now() / 1000));
  const tail = left > 0 ? `下次检查 ${left} 秒后` : "正在检查…";
  $("activity").innerHTML = `<b>${names[S.mode]}</b> · ${esc(S.activity || "等待第一次数据")} · ${tail}`;
}
setInterval(renderStatus, 1000);
$("wi-price").oninput = e => { whatIfPrice = e.target.value === "" ? null : parseFloat(e.target.value); render(); };
$("wi-diff").oninput = render;
$("wi-reset").onclick = () => { whatIfPrice = null; $("wi-price").value = ""; $("wi-diff").value = 1; render(); };
$("f-plat").onchange = render; $("f-profit").onchange = render;

function render() {
  if (!S || !S.price) return;
  const modes = { live: ["真租中", "var(--good)"], simulate: ["模拟（不花钱）", "var(--warn)"], halted: ["已暂停", "var(--ink-3)"] };
  const [mtext, mcolor] = modes[S.mode];
  $("mode").innerHTML = `<span class="dot" style="background:${mcolor}"></span>${mtext}`;
  $("btn-live").disabled = S.mode !== "live" && S.live_blockers.length > 0;
  for (const [id, m] of [["btn-sim", "simulate"], ["btn-pause", "halted"], ["btn-live", "live"]])
    $(id).setAttribute("aria-pressed", S.mode === m ? "true" : "false");
  renderStatus();
  $("updated").textContent = `更新于 ${ago(S.now)} · 每 ${S.loop_seconds} 秒刷新`;
  if (!$("wi-price").placeholder || whatIfPrice == null) $("wi-price").placeholder = S.price.price?.toFixed(3) ?? "";

  $("btn-live").title = S.live_blockers.length ? "真租还没解锁：" + S.live_blockers.join("；") : "";
  let n = "";
  if (!S.price.live)
    n += `<div class="notice err">拿不到实时币价（${S.price.source ? "正在用" + esc(S.price.source) + "价格，" : ""}不会租新卡；超过 ${S.limits.price_stale_minutes} 分钟会退掉所有卡）</div>`;
  const errs = Object.entries(S.errors || {});
  if (errs.length) n += `<div class="notice err"><b>数据源出错</b><br>${errs.map(([k, v]) => esc(k) + "：" + esc(v)).join("<br>")}</div>`;
  $("notices").innerHTML = n;

  const live = S.instances.filter(i => !i.simulated), sim = S.instances.filter(i => i.simulated);
  const T = S.mode === "simulate" ? S.totals.sim : S.totals.real;
  const label = S.mode === "simulate" ? "模拟" : "实际";
  const poolPnl = S.totals.real.pnl_pool;
  const h = S.hashrates["RTX 5090"];
  $("tiles").innerHTML = [
    ["PRL 价格", S.price.price == null ? "—" : "$" + S.price.price.toFixed(3),
      (S.price.manual ? "手动价格，仅用于模拟" : `${esc(S.price.source || "无")} · ${S.price.live ? "实时" : "非实时"}`)
        + " · <a data-settings>设置</a>"],
    ["Vast 余额", usd(S.balance), (S.balance == null ? (S.vast_key_set ? "拿不到余额（见上方报错）" : "没填 API key") : S.runway_days == null ? "当前没有花费"
      : `按当前花费还能撑 ${S.runway_days.toFixed(1)} 天`) + " · <a data-settings>设置</a>"],
    ["运行中", `${live.length + sim.length} 台`, `真实 ${live.length} · 模拟 ${sim.length} · 实际花费 ${usd(S.hourly_spend, 3)}/h`],
    [`${label}累计盈亏（估）`, pnl(T.pnl_est), `花费 ${usd(T.cost)} · 预计挖到 ${T.prl_est.toFixed(3)} PRL`],
    ["矿池实际盈亏", poolPnl == null ? "—" : pnl(poolPnl),
      S.totals.real.prl_pool == null ? "没配置矿池统计 API" : `矿池实收 ${S.totals.real.prl_pool.toFixed(3)} PRL`],
    ["产出 / 算力", `${(S.yield.value * 1000).toFixed(2)}`,
      `PRL/天 每 1000 TH/s（${esc(S.yield.source)}）` + (h ? ` · 5090 ${h.measured ? h.measured.toFixed(0) + " TH/s 实测" : h.config + " TH/s 配置"}` : "")],
  ].map(([l, v, s]) => `<div class="tile"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`).join("");

  if (!S.instances.length) $("inst").innerHTML = `<tr><td class="empty">没有运行中的实例</td></tr>`;
  else $("inst").innerHTML = `<tr><th class="l">实例</th><th>GPU</th><th>$/小时</th><th>已运行</th><th>状态</th>
    <th>算力 实测/预期</th><th>已花费</th><th>预计 PRL</th><th>利润率</th><th>保本价</th><th></th></tr>` +
    S.instances.map(i => { const e = econ(i.usd_per_hr, i.expected_th);
      return `<tr><td class="l">${esc(i.id)}${i.simulated ? ' <span class="muted">模拟</span>' : ""}</td>
      <td>${esc(i.gpu)} ×${i.num_gpus}</td><td>${usd(i.usd_per_hr, 3)}</td><td>${dur(i.age_min)}</td>
      <td>${esc(i.status || "")}${i.gpu_util != null ? " · " + Math.round(i.gpu_util) + "%" : ""}${i.bad_checks ? ` · 亏损 ${i.bad_checks} 次` : ""}</td>
      <td>${i.pool_th != null ? i.pool_th.toFixed(0) : "—"} / ${i.expected_th.toFixed(0)}</td>
      <td>${usd(i.cost, 3)}</td><td>${i.prl_est.toFixed(3)}</td><td>${pnlPct(e.margin)}</td><td>${usd(e.be, 3)}</td>
      <td><button data-id="${esc(i.id)}" class="danger kill">退租</button></td></tr>`; }).join("");
  document.querySelectorAll(".kill").forEach(b => b.onclick = () => {
    if (confirm(`退租 ${b.dataset.id}？`)) post("/api/destroy", { id: b.dataset.id }); });

  const plats = [...new Set(S.offers.map(o => o.platform))];
  const sel = $("f-plat"), cur = sel.value;
  sel.innerHTML = `<option value="">全部</option>` + plats.map(p => `<option ${p === cur ? "selected" : ""}>${esc(p)}</option>`).join("");
  const rows = S.offers.map(o => ({ o, e: econ(o.usd_per_hr, o.hashrate_th) }))
    .filter(({ o, e }) => (!sel.value || o.platform === sel.value) && (!$("f-profit").checked || (e.profit ?? -1) > 0))
    .sort((a, b) => (b.e.margin ?? -9) - (a.e.margin ?? -9));
  if (!rows.length) $("offers").innerHTML = `<tr><td class="empty">没有报价（检查 API key 和 gpus 配置）</td></tr>`;
  else $("offers").innerHTML = `<tr><th class="l">平台</th><th>GPU</th><th>$/小时</th><th>每天成本</th><th>每天收入</th>
    <th>每天利润</th><th>利润率</th><th>保本币价</th><th>可靠性</th><th class="l">地区/备注</th></tr>` +
    rows.map(({ o, e }) => `<tr class="${(e.profit ?? 0) < 0 ? "loss" : ""}">
      <td class="l">${esc(o.platform)}${o.rentable ? "" : ' <span class="muted">仅比价</span>'}</td>
      <td>${esc(o.gpu)} ×${o.num_gpus}</td><td>${usd(o.usd_per_hr, 3)}</td><td>${usd(e.cost)}</td><td>${usd(e.rev)}</td>
      <td>${pnl(e.profit)}</td><td>${pnlPct(e.margin)}</td><td>${usd(e.be, 3)}</td>
      <td>${o.reliability == null ? "—" : (o.reliability * 100).toFixed(1) + "%"}</td><td class="l">${esc(o.location || "")}</td></tr>`).join("");

  const kinds = { rent: "租用", destroy: "退租", mode: "模式", error: "错误" };
  $("log").innerHTML = S.events.length ? S.events.map(ev =>
    `<div><span class="muted">${new Date(ev.ts * 1000).toLocaleString()}</span> · <b>${kinds[ev.kind] || esc(ev.kind)}</b>` +
    `${ev.simulated ? ' <span class="muted">(模拟)</span>' : ""} · ${esc(ev.message)}</div>`).join("")
    : `<div class="empty">还没有操作</div>`;
}
function pnlPct(m) {
  if (m == null) return "—";
  return `<span class="pnl ${m >= 0 ? "up" : "down"}">${m >= 0 ? "▲" : "▼"} ${pct(Math.abs(m))}</span>`;
}

async function refresh() {
  try {
    const data = await (await fetch("/api/state")).json();
    if (data.loading) {
      $("updated").textContent = data.error ? "第一次拉数据出错了，见下方" : "正在第一次拉取数据，网络慢时最多要 1 分钟…";
      $("notices").innerHTML = data.error
        ? `<div class="notice err"><b>控制循环出错</b>（把这段发给 Claude）<pre style="white-space:pre-wrap;margin:6px 0 0">${esc(data.error)}</pre></div>` : "";
      setTimeout(refresh, 3000);
      return;
    }
    S = data; render();
  }
  catch (e) { $("updated").textContent = `连不上控制器（${e.message}），15 秒后重试`; }
}
refresh();
setInterval(refresh, 15000);

// ---------------------------------------------------------------- settings
async function openSettings() {
  $("set-error").textContent = "";
  let v;
  try { v = await (await fetch("/api/settings")).json(); } catch (e) { alert("读取设置失败：" + e.message); return; }
  $("set-path").textContent = v.mock ? "演示模式（假数据）不能保存设置" : "保存到 " + (v.config_path || "config.yaml");
  $("set-market").value = v.price.safetrade_market || "";
  $("set-coingecko").value = v.price.coingecko_id || "";
  $("set-manual").value = v.price.manual_usd ?? "";
  $("set-manual-sim").checked = !!v.price.manual_in_simulation;
  $("set-key").value = "";
  $("set-key").placeholder = v.vast_key_set ? `已设置（…${v.vast_key_hint}），留空不改` : "未设置";
  $("set-clear").checked = false;
  $("set-clear-row").hidden = !v.vast_key_set;
  $("set-wallet").value = v.wallet || "";
  $("set-save").disabled = v.mock;
  if (v.vast_key_from_env) $("set-error").textContent = "注意：环境变量 VAST_API_KEY 已设置，它会覆盖这里保存的 key。";
  $("settings").showModal();
}
$("btn-settings").onclick = openSettings;
document.addEventListener("click", e => { if (e.target.closest("[data-settings]")) openSettings(); });
$("set-cancel").onclick = () => $("settings").close();
$("set-form").onsubmit = async e => {
  e.preventDefault();
  $("set-save").disabled = true;
  $("set-error").textContent = "";
  const clickedAt = Date.now() / 1000;
  try {
    const r = await fetch("/api/settings", { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({
        price: { safetrade_market: $("set-market").value, coingecko_id: $("set-coingecko").value,
                 manual_usd: $("set-manual").value, manual_in_simulation: $("set-manual-sim").checked },
        vast_api_key: $("set-key").value, clear_vast_key: $("set-clear").checked, wallet: $("set-wallet").value,
      }) });
    const data = await r.json();
    if (!r.ok) { $("set-error").textContent = data.error || "保存失败"; return; }
    $("settings").close();
    toast("设置已保存，正在用新设置拉数据…");
    awaitFreshCycle(clickedAt);
  } catch (err) {
    $("set-error").textContent = "保存失败：" + err.message;
  } finally {
    $("set-save").disabled = false;
  }
};

// ---------------------------------------------------------------- history
let H = null;
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

function renderHistory() {
  if (!H) return;
  if (S && S.limits) $("band-label").textContent = `有值得租的卡（利润率 ≥ ${pct(S.limits.min_margin)}）`;
  const s = H.summary;
  if (s.samples < 2) {
    $("hist-verdict").textContent = "数据还不够，跑一会儿就有了。";
    $("hist-tiles").innerHTML = "";
  } else {
    const share = s.observed_hours ? s.rentable_hours / s.observed_hours : 0;
    $("hist-verdict").textContent = `已观察 ${s.observed_hours.toFixed(1)} 小时（电脑休眠不算）`;
    $("hist-tiles").innerHTML = [
      ["价格区间", `${usd(s.price_min, 3)} – ${usd(s.price_max, 3)}`, `平均 ${usd(s.price_avg, 3)}`],
      ["值得租的时间", `${s.rentable_hours.toFixed(1)} 小时`, `占 ${(share * 100).toFixed(0)}%`],
      ["最便宜的卡", s.cheapest_seen == null ? "—" : usd(s.cheapest_seen, 3) + "/h",
        "最好利润率中位数 " + (s.median_best_margin == null ? "—" : pct(s.median_best_margin))],
      ["模拟盈亏", pnl(s.sim_pnl), `${s.sim_rentals} 次租用 · 花费 ${usd(s.sim_cost)} · ${s.sim_prl.toFixed(3)} PRL`],
    ].map(([l, v, sub]) => `<div class="tile"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${sub}</div></div>`).join("");
  }
  drawChart(H.points);
}

function drawChart(pts) {
  const svg = $("chart");
  svg.textContent = "";
  const W = svg.clientWidth || 600, Hh = 220, L = 48, R = 12, T = 10, B = 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${Hh}`);
  const vals = pts.flatMap(p => [p.price_live ? p.price : null, p.cheapest_breakeven]).filter(v => v != null);
  if (pts.length < 2 || !vals.length) {
    el("text", { x: W / 2, y: Hh / 2, "text-anchor": "middle" }, svg).textContent = "还没有历史数据";
    return;
  }
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo || hi * 0.1 || 1) * 0.08; lo = Math.max(0, lo - pad); hi += pad;
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts;
  const x = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (Hh - T - B);
  const gapLimit = Math.max(600, (t1 - t0) / pts.length * 5);

  // bands where something was worth renting
  for (let i = 0; i < pts.length - 1; i++)
    if (pts[i].rentable_n > 0 && pts[i + 1].ts - pts[i].ts < gapLimit)
      el("rect", { x: x(pts[i].ts), y: T, width: Math.max(1, x(pts[i + 1].ts) - x(pts[i].ts)), height: Hh - T - B,
        fill: "var(--band)" }, svg);
  // grid + y labels
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = "$" + v.toFixed(2);
  }
  const nx = Math.max(2, Math.min(6, Math.floor((W - L - R) / 90)));
  for (let k = 0; k <= nx; k++) {
    const t = t0 + (t1 - t0) * k / nx;
    el("text", { x: x(t), y: Hh - 6, "text-anchor": k === 0 ? "start" : k === nx ? "end" : "middle" }, svg).textContent = hhmm(t);
  }
  const path = key => {
    let d = "", prev = null;
    for (const p of pts) {
      const v = key === "price" ? (p.price_live ? p.price : null) : p[key];
      if (v == null) { prev = null; continue; }
      d += (prev && p.ts - prev.ts < gapLimit ? "L" : "M") + x(p.ts).toFixed(1) + "," + y(v).toFixed(1);
      prev = p;
    }
    return d;
  };
  el("path", { d: path("cheapest_breakeven"), fill: "none", stroke: "var(--series-2)", "stroke-width": 2,
    "stroke-dasharray": "5 4", "stroke-linejoin": "round" }, svg);
  el("path", { d: path("price"), fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);

  const cross = el("line", { y1: T, y2: Hh - B, stroke: "var(--ink-3)", "stroke-width": 1, visibility: "hidden" }, svg);
  const dot = el("circle", { r: 4, fill: "var(--series-1)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg);
  const tip = $("tip");
  svg.onpointermove = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    let best = pts[0];
    for (const p of pts) if (Math.abs(x(p.ts) - px) < Math.abs(x(best.ts) - px)) best = p;
    cross.setAttribute("x1", x(best.ts)); cross.setAttribute("x2", x(best.ts)); cross.setAttribute("visibility", "visible");
    if (best.price_live && best.price != null) {
      dot.setAttribute("cx", x(best.ts)); dot.setAttribute("cy", y(best.price)); dot.setAttribute("visibility", "visible");
    } else dot.setAttribute("visibility", "hidden");
    tip.textContent = "";
    const line = (val, label) => { const d = document.createElement("div"); const b = document.createElement("b");
      b.textContent = val; d.append(b, " " + label); tip.appendChild(d); };
    const head = document.createElement("div"); head.className = "muted"; head.textContent = hhmm(best.ts); tip.appendChild(head);
    line(best.price_live && best.price != null ? usd(best.price, 3) : "无实时价", "PRL 价格");
    line(usd(best.cheapest_breakeven, 3), "保本价");
    line(best.rentable_n ? best.rentable_n + " 个" : "没有", "值得租的卡");
    tip.hidden = false;
    const left = x(best.ts) / W * r.width;
    tip.style.left = Math.min(Math.max(0, left + 12), r.width - tip.offsetWidth) + "px";
    tip.style.top = "8px";
  };
  svg.onpointerleave = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
}

async function refreshHistory() {
  try { H = await (await fetch("/api/history")).json(); renderHistory(); } catch (e) {}
}
refreshHistory();
setInterval(refreshHistory, 60000);
window.addEventListener("resize", () => H && drawChart(H.points));
</script>
